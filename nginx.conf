server {
    server_name cbnyellowsingam.in www.cbnyellowsingam.in news.cbnyellowsingam.in www.news.cbnyellowsingam.in;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Max upload size for Cloudinary/Multer
    client_max_body_size 100M;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/news.cbnyellowsingam.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/news.cbnyellowsingam.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.news.cbnyellowsingam.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = news.cbnyellowsingam.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = www.cbnyellowsingam.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = cbnyellowsingam.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name cbnyellowsingam.in www.cbnyellowsingam.in news.cbnyellowsingam.in www.news.cbnyellowsingam.in;
    return 404; # managed by Certbot
}
