<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR News — Tehelka</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, 'Noto Sans Telugu', sans-serif; overflow: hidden; touch-action: none; }
    #ui { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 14px; z-index: 5; }
    #ui h2 { margin: 0; font-size: 18px; font-weight: 700; }
    #ui p { margin: 0; color: #c9c9d3; font-size: 14px; max-width: 320px; line-height: 1.5; }
    .btn { background: #3f2a7a; color: #fff; border: 0; border-radius: 30px; padding: 14px 26px; font-size: 16px; font-weight: 700; cursor: pointer; }
    #hint { position: fixed; top: 14px; left: 0; right: 0; text-align: center; font-size: 14px; z-index: 6; display: none; text-shadow: 0 1px 4px #000; pointer-events: none; }
    #cap { position: fixed; right: 18px; bottom: 26px; z-index: 8; display: none; width: 60px; height: 60px; border-radius: 50%; border: 2px solid #fff; background: rgba(63,42,122,.85); color: #fff; font-size: 26px; cursor: pointer; }
    #shot { position: fixed; left: 16px; right: 16px; bottom: 100px; z-index: 9; display: none; background: rgba(0,0,0,.85); color: #fff; border-radius: 12px; padding: 14px 16px; text-align: center; font-size: 15px; line-height: 1.5; }
    img.fallback { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; z-index: 4; }
    #why { position: fixed; top: 0; left: 0; right: 0; z-index: 9; background: rgba(180,30,30,.92); color: #fff; font-size: 14px; padding: 12px 14px; text-align: center; line-height: 1.4; }
  </style>
</head>
<body>
  <div id="ui">
    <h2 id="ttl">View in AR 👓</h2>
    <p id="msg">Start AR and the news card floats in front of you. One finger to move it anywhere, two fingers to zoom.</p>
    <div id="btnHost"></div>
  </div>
  <div id="hint">👆 One finger to move &nbsp;·&nbsp; ✌️ Two fingers to zoom</div>
  <button id="cap" onclick="showShot()">📸</button>
  <div id="shot">📸 To take a photo: press <b>Power + Volume-Down</b> together once<br>→ it saves a photo of the news card in your room</div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

    const params = new URLSearchParams(location.search);
    const img = params.get('img') || '';
    const title = params.get('title') || '';
    if (title) document.getElementById('ttl').textContent = title;
    const $ = (id) => document.getElementById(id);
    let _shotT;
    window.showShot = function () {
      $('shot').style.display = 'block';
      clearTimeout(_shotT); _shotT = setTimeout(() => { $('shot').style.display = 'none'; }, 4000);
    };

    function fallback(reason) {
      // Keep the REASON visible on screen so the owner can tell why AR didn't open.
      $('btnHost').innerHTML = ''; $('ui').style.display = 'none';
      const why = document.createElement('div'); why.id = 'why';
      why.textContent = '⚠️ ' + reason + ' — open in Chrome (showing the image normally)';
      document.body.appendChild(why);
      if (!img) { why.textContent = '⚠️ Image not found.'; return; }
      const i = document.createElement('img'); i.className = 'fallback'; i.src = img;
      document.body.appendChild(i);
    }
    if (!img) { fallback('Image not found'); throw new Error('no img'); }

    (async () => {
      if (!('xr' in navigator)) return fallback('AR is not available in this browser');
      let ok = false;
      try { ok = await navigator.xr.isSessionSupported('immersive-ar'); } catch (e) { ok = false; }
      if (!ok) return fallback('This phone does not support AR');
      startAR();
    })();

    function startAR() {
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 20);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(devicePixelRatio);
      renderer.setSize(innerWidth, innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);
      scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.3));

      // The news card: a flat plane textured with the captured card image.
      const BASE_W = 0.55; // metres wide at scale 1
      const mat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, toneMapped: false, transparent: true });
      const card = new THREE.Mesh(new THREE.PlaneGeometry(BASE_W, BASE_W), mat);
      card.visible = false;
      scene.add(card);
      new THREE.TextureLoader().load(img, (t) => {
        t.colorSpace = THREE.SRGBColorSpace;
        const a = t.image.width / t.image.height;
        card.geometry.dispose();
        card.geometry = new THREE.PlaneGeometry(BASE_W, BASE_W / a);
        mat.map = t; mat.needsUpdate = true;
      }, undefined, () => fallback('Could not load image'));

      let placed = false;
      let scale = 1;
      const DIST = 1.1; // metres in front of the camera on first show

      const btn = ARButton.createButton(renderer, {
        optionalFeatures: ['dom-overlay'],
        domOverlay: { root: document.body },
      });
      btn.textContent = '👓 Start AR'; btn.className = 'btn'; btn.style.position = 'static';
      $('btnHost').appendChild(btn);

      renderer.xr.addEventListener('sessionstart', () => { placed = false; $('ui').style.display = 'none'; $('hint').style.display = 'block'; $('cap').style.display = 'block'; });
      renderer.xr.addEventListener('sessionend', () => { $('hint').style.display = 'none'; $('cap').style.display = 'none'; $('shot').style.display = 'none'; $('ui').style.display = 'flex'; card.visible = false; });

      // ── Gestures (gallery-style) ──
      // 1 finger: drag the card anywhere on screen → moved in the camera's screen
      //           plane (right/up vectors), so up/down/left/right all work.
      // 2 fingers: pinch → zoom in/out.
      let mode = null, sx = 0, sy = 0, startPos = new THREE.Vector3(), startDist = 0, startScale = 1;
      const _right = new THREE.Vector3(), _up = new THREE.Vector3();
      function touchDist(t) { const dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY; return Math.hypot(dx, dy); }
      function xrCam() { return renderer.xr.isPresenting ? renderer.xr.getCamera() : camera; }
      function worldPerPixel() {
        const c = xrCam();
        const pm = (c.cameras && c.cameras[0]) ? c.cameras[0].projectionMatrix : c.projectionMatrix;
        const e5 = pm.elements[5] || 1.73; // 1/tan(fovY/2)
        const fovY = 2 * Math.atan(1 / e5);
        const d = card.position.distanceTo(c.position) || DIST;
        return (2 * d * Math.tan(fovY / 2)) / innerHeight;
      }
      document.body.addEventListener('touchstart', (e) => {
        if (!card.visible) return;
        if (e.touches.length === 1) { mode = 'move'; sx = e.touches[0].clientX; sy = e.touches[0].clientY; startPos.copy(card.position); }
        else if (e.touches.length >= 2) { mode = 'zoom'; startDist = touchDist(e.touches); startScale = scale; }
      }, { passive: false });
      document.body.addEventListener('touchmove', (e) => {
        if (!card.visible || !mode) return;
        e.preventDefault();
        const c = xrCam();
        if (mode === 'move' && e.touches.length === 1) {
          const dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
          const k = worldPerPixel();
          _right.set(1, 0, 0).applyQuaternion(c.quaternion);
          _up.set(0, 1, 0).applyQuaternion(c.quaternion);
          card.position.copy(startPos).addScaledVector(_right, dx * k).addScaledVector(_up, -dy * k);
        } else if (mode === 'zoom' && e.touches.length >= 2) {
          const d = touchDist(e.touches);
          scale = Math.min(6, Math.max(0.25, startScale * (d / (startDist || d))));
        }
      }, { passive: false });
      const endTouch = (e) => { if (e.touches.length === 0) mode = null; else if (e.touches.length === 1) { mode = 'move'; sx = e.touches[0].clientX; sy = e.touches[0].clientY; startPos.copy(card.position); } };
      document.body.addEventListener('touchend', endTouch);
      document.body.addEventListener('touchcancel', endTouch);

      renderer.setAnimationLoop(() => {
        if (renderer.xr.isPresenting) {
          const c = xrCam();
          if (!placed && c.position.lengthSq() >= 0) {
            // First frame of the session: float the card ~1.1 m straight ahead.
            const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(c.quaternion);
            card.position.copy(c.position).addScaledVector(fwd, DIST);
            card.visible = true; placed = true;
          }
          card.scale.setScalar(scale);
          card.lookAt(c.position); // always face the reader — never crooked
        }
        renderer.render(scene, camera);
      });

      addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
    }
  </script>
</body>
</html>
